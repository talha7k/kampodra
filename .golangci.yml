# kampodra lint gate: duplication and untestable buried logic are blocking
# review findings (AGENTS.md), so they gate here — not as style nits.
# `make lint` runs this; CI runs it alongside test/vet.
version: "2"
linters:
  enable:
    - govet
    - staticcheck
    - unused # dead code
    - errcheck # unchecked errors
    - ineffassign
    - misspell
    - unconvert
    - unparam
    - dupl # copy-paste/structural clones -> extract a shared helper
    - gocognit # cognitive complexity -> refactor target
    - gocyclo # cyclomatic complexity -> refactor target
  disable:
    - err113 # goerr113: dynamic-error style clashes with this repo's fmt.Errorf convention
  settings:
    dupl:
      threshold: 120 # tokens; below this is idiom, above is drift risk
    gocognit:
      min-complexity: 25
    gocyclo:
      min-complexity: 20
    errcheck:
      # Test helpers intentionally ignore errors on fixture writes; the tool
      # output buffers never fail. Production code stays strict.
      exclude-functions:
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).WriteString
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.MkdirAll
        - os.WriteFile
        - os.Remove
        - os.Chmod
        - (*os.File).Close
        - io.Copy
  exclusions:
    rules:
      - linters: [errcheck, unparam]
        path: _test\.go$
      # No complexity allowlist: the burn-down is COMPLETE (2026-10-09) —
      # every function is under the gocognit 25 / gocyclo 20 bar, and the
      # gate now fails on ANY function above it, forever.
formatters:
  enable:
    - gofmt
    - goimports
