name: ci

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # keep in sync with the `go` directive in go.mod — a mismatch makes the go
  # command download its own toolchain mid-build (slow, and the module-cache
  # download has been flaky on runners: tar "File exists" storms).
  GO_VERSION: "1.27.1"

jobs:
  test:
    name: test · vet · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test ./...
        run: go test ./...
      - name: project magic-string guard
        run: go test ./internal/adapter/project/ -run TestNoProjectMagicStringsOutsideProjectDotGo -count=1
      - name: go vet
        run: go vet ./...
      - name: lint gate (golangci-lint — duplication + complexity are blocking)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          $(go env GOPATH)/bin/golangci-lint run ./...
      - name: go build
        run: go build ./...
      - name: npm shim tests
        run: node --test npm/test/shim.test.mjs

  cross-compile:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" -o dist/kampodra ./cmd/kampodra
      # smoke-exec only when the artifact matches the runner (ubuntu x64):
      # a darwin/arm64 or linux/arm64 binary can't exec here — verify it
      # structurally instead (Mach-O / ELF arm64 header).
      - name: smoke (serves --version)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          chmod +x dist/kampodra
          ./dist/kampodra --version
      - name: smoke (binary header matches target platform)
        if: matrix.goos != 'linux' || matrix.goarch != 'amd64'
        run: |
          test -x dist/kampodra
          case "${{ matrix.goos }}/${{ matrix.goarch }}" in
            darwin/arm64) file dist/kampodra | grep -q "Mach-O 64-bit executable arm64" ;;
            darwin/amd64) file dist/kampodra | grep -q "Mach-O 64-bit executable x86_64" ;;
            linux/arm64)  file dist/kampodra | grep -q "ELF 64-bit.*ARM aarch64" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: kampodra-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/kampodra
          retention-days: 7
