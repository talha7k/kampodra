name: ci

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.24"

jobs:
  test:
    name: test · vet · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test ./...
        run: go test ./...
      - name: command-parity guard (frozen-spec coverage)
        run: go test ./internal/command/ -run TestCommandParityGuard -count=1 -v
      - name: project magic-string guard
        run: go test ./internal/adapter/project/ -run TestNoProjectMagicStringsOutsideProjectDotGo -count=1
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: npm shim tests
        run: node --test npm/test/shim.test.mjs

  cross-compile:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" -o dist/kampodra ./cmd/kampodra
      - name: smoke (serves --version)
        run: |
          chmod +x dist/kampodra
          ./dist/kampodra --version
      - uses: actions/upload-artifact@v4
        with:
          name: kampodra-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/kampodra
          retention-days: 7
